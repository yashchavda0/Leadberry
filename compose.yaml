name: leadberry-crm

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: leadberry
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/initialize.sh:/docker-entrypoint-initdb.d/10-crm-roles.sh:ro
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leadberry"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-bookworm
    command: ["sh", "-ec", "exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction --requirepass \"$$(cat /run/secrets/redis_password)\""]
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

secrets:
  postgres_password:
    file: ./.docker-secrets/postgres_password
  redis_password:
    file: ./.docker-secrets/redis_password
